# ros2_control controllers for the four-wheel-steering robot.
# Joint order in every list: front_left, front_right, rear_left, rear_right
# (the same order the kinematics code uses).

controller_manager:
  ros__parameters:
    update_rate: 100   # [Hz]

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    steering_controller:
      type: position_controllers/JointGroupPositionController

    wheel_controller:
      type: velocity_controllers/JointGroupVelocityController

    # The C++ four-wheel-steering controller (agri_ugv_four_ws): instead of the two
    # controllers above and the Python four_ws_driver and wheel_odometry nodes
    four_ws_controller:
      type: agri_ugv_four_ws/FourWsController

steering_controller:
  ros__parameters:
    joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint

wheel_controller:
  ros__parameters:
    joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint

four_ws_controller:
  ros__parameters:
    steering_joints:
      - front_left_steer_joint
      - front_right_steer_joint
      - rear_left_steer_joint
      - rear_right_steer_joint
    wheel_joints:
      - front_left_wheel_joint
      - front_right_wheel_joint
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    # The steering axes [m] and the wheel radius [m], as in the robot model
    # (test_controllers.py checks that they agree)
    module_x: [0.675, 0.675, -0.675, -0.675]
    module_y: [0.75, -0.75, 0.75, -0.75]
    wheel_radius: 0.205
